# Sanayei Panel Configuration

server:
  host: "0.0.0.0"
  port: 8080
  secret_key: "${SECRET_KEY}"

database:
  path: "${DB_PATH}"
  type: "sqlite"

panel:
  title: "Sanayei Panel"
  theme: "dark"
  language: "fa"

xray:
  version: "1.8.4"
  config_path: "/app/config/xray.json"
  log_level: "warning"

telegram:
  enable: false
  bot_token: ""
  chat_id: ""

backup:
  enable: true
  interval: 24  # hours
  path: "/app/data/backups"
  max_backups: 7
